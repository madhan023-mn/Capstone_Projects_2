<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mvGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="mvShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#mvGradient)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#FDE68A" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Shopping Bag Icon (MarketVerse Emblem) -->
  <g filter="url(#mvShadow)">
    <!-- Bag Handle -->
    <path d="M24 24V19C24 14.5817 27.5817 11 32 11C36.4183 11 40 14.5817 40 19V24" 
          stroke="#0F172A" 
          stroke-width="4.5" 
          stroke-linecap="round"/>

    <!-- Bag Body -->
    <path d="M16 23.5H48L45.2 51C45.05 52.68 43.65 54 41.96 54H22.04C20.35 54 18.95 52.68 18.8 51L16 23.5Z" 
          fill="#0F172A"/>

    <!-- Sparkle / Star on Bag -->
    <path d="M32 30L33.8 35.2L39 37L33.8 38.8L32 44L30.2 38.8L25 37L30.2 35.2L32 30Z" 
          fill="#FBBF24"/>
  </g>
</svg>
